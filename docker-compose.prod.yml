# Production stack: Postgres + Redis + API + web frontend.
# Required env (see README): POSTGRES_PASSWORD, JWT_ACCESS_SECRET,
# JWT_REFRESH_SECRET. Optional: STRIPE_*, PAYMOB_*, ANTHROPIC_API_KEY.
#
#   docker compose -f docker-compose.prod.yml up -d --build
# Seed the demo dataset once the API is healthy:
#   docker compose -f docker-compose.prod.yml exec backend \
#     pnpm --filter @restaurant/database seed
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_pos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    volumes:
      - redis_data:/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-restaurant_pos}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOYALTY_AMOUNT_PER_POINT: ${LOYALTY_AMOUNT_PER_POINT:-10}
      LOYALTY_POINT_EXPIRY_MONTHS: ${LOYALTY_POINT_EXPIRY_MONTHS:-12}
      LOYALTY_SILVER_THRESHOLD: ${LOYALTY_SILVER_THRESHOLD:-500}
      LOYALTY_GOLD_THRESHOLD: ${LOYALTY_GOLD_THRESHOLD:-2000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-egp}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-}
      PAYMOB_IFRAME_ID: ${PAYMOB_IFRAME_ID:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_CURRENCY: ${PAYMOB_CURRENCY:-EGP}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      REPORT_CRON: ${REPORT_CRON:-0 6 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - restaurant-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  restaurant-network:
    driver: bridge
